openapi: 3.1.0
info:
  title: Job Tracker API
  version: 1.0.0
servers:
  - url: https://auto-job-tracking-analysis.vercel.app/
paths:
  /api/jobs:
    post:
      summary: Submit analyzed jobs to the tracking dashboard
      operationId: submitJobs
      x-openai-isConsequential: false
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobsRequest'
      responses:
        '200':
          description: Jobs submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitJobsResponse'
components:
  schemas:
    Job:
      type: object
      required:
        - company
        - jobTitle
        - link
      properties:
        company:
          type: string
        jobTitle:
          type: string
        location:
          type: string
        salary:
          type: string
        citizenshipRisk:
          type: string
        overallMatchPercent:
          type: number
        applyRecommendation:
          type: string
        link:
          type: string
          format: uri
    SubmitJobsRequest:
      type: object
      required:
        - jobs
      properties:
        replaceExisting:
          type: boolean
          description: Optional. Defaults to false; when true it replaces all stored jobs.
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    SubmitJobsResponse:
      type: object
      properties:
        ok:
          type: boolean
        count:
          type: integer
        updatedAt:
          type: string
          format: date-time
        storage:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
